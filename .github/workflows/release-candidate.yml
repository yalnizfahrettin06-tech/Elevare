name: Verify unsigned release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Release compilation and checks
        run: bash gradlew :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon --max-workers=2
      - name: Unsigned candidate - NOT a store delivery
        uses: actions/upload-artifact@v4
        with:
          name: Elevare-0.13.0-UNSIGNED-release-candidate
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-reports
          path: app/build/reports/


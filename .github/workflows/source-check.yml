name: Build Elevare Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Verify source
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Build and test
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Elevare-0.7.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/device-qa.sh
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elevare-0.7.0-verification
          path: |
            device-qa/
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
